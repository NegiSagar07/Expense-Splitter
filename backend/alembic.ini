[alembic]
# path to migration scripts
script_location = migrations

# Prepend /app (the working directory) to sys.path so `from app.xxx` works
prepend_sys_path = .

# DB URL is NOT stored here — it is injected from env via app/core/config.py
# sqlalchemy.url =    ← intentionally left blank

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARN
handlers = console
qualname =

[logger_sqlalchemy]
level = WARN
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
