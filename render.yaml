# ==============================================================
# render.yaml — Render Infrastructure as Code (Blueprint)
# Expense Splitter Application
# ==============================================================
# Deploy to Render via Dashboard → Blueprints → Connect Repository
# ==============================================================

services:
  # ── FastAPI Web Service ──────────────────────────────────────
  - type: web
    name: expense-splitter-api
    runtime: docker
    dockerfilePath: ./backend/Dockerfile
    dockerContext: ./backend
    plan: free
    region: singapore
    preDeployCommand: alembic upgrade head
    healthCheckPath: /api/v1/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: expense-splitter-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "10080"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      - key: ALLOWED_ORIGINS
        value: "http://localhost:3007,https://expense-splitter-web.onrender.com"
      - key: JOIN_REQUEST_EXPIRY_DAYS
        value: "7"
      - key: DEBUG
        value: "false"

  # ── React / Vite Frontend Static Site ────────────────────────
  - type: web
    name: expense-splitter-web
    runtime: static
    buildCommand: cd frontend && npm ci && npm run build
    staticPublishPath: ./frontend/dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_URL
        value: https://expense-splitter-api.onrender.com/api/v1

databases:
  # ── Render Managed PostgreSQL Database ───────────────────────
  - name: expense-splitter-db
    databaseName: expense_splitter_db
    user: expense_user
    plan: free
    region: singapore
