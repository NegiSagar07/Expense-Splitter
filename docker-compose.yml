# ==============================================================
# docker-compose.yml — Local development environment
# Expense Splitter
# ==============================================================
# Usage:
#   docker compose up --build -d          # start everything
#   docker compose exec backend alembic upgrade head
#   docker compose logs -f backend        # tail logs
#   docker compose down                   # stop
#   docker compose down -v                # stop + wipe DB volume
# ==============================================================

services:

  # ── PostgreSQL ──────────────────────────────────────────────
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      # Expose on the non-default port 5487 to avoid collision
      # with any existing local PostgreSQL instance on 5432
      - "${POSTGRES_PORT:-5487}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── FastAPI Backend ─────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
      target: runtime
    restart: unless-stopped
    # Override CMD to add --reload so uvicorn picks up source changes instantly.
    # Volume mounts below sync host source into the container in real time —
    # no docker cp or image rebuild needed during development.
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      # Pass every env var the app needs from the root .env file.
      # Note: DATABASE_URL uses internal Docker hostname `db`, not localhost.
      DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@db:5432/${POSTGRES_DB}
      SECRET_KEY: ${SECRET_KEY}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      REFRESH_TOKEN_EXPIRE_DAYS: ${REFRESH_TOKEN_EXPIRE_DAYS:-7}
      ALLOWED_ORIGINS: ${ALLOWED_ORIGINS}
      JOIN_REQUEST_EXPIRY_DAYS: ${JOIN_REQUEST_EXPIRY_DAYS:-7}
      DEBUG: ${DEBUG:-true}
      PORT: 8000
    volumes:
      # Bind-mount source directories — changes on host are instantly visible
      # in the container. uvicorn --reload then auto-restarts on .py changes.
      - ./backend/app:/app/app
      - ./backend/migrations:/app/migrations
      - ./backend/alembic.ini:/app/alembic.ini
      - ./backend/scripts:/app/scripts
      - ./backend/tests:/app/tests
    depends_on:
      db:
        condition: service_healthy

  # ── Vite React Frontend ─────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      target: development
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3007}:3007"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    environment:
      - VITE_API_BASE_URL=${VITE_API_BASE_URL:-http://localhost:8000/api/v1}
    depends_on:
      - backend

volumes:
  postgres_data:
    name: expense_splitter_pgdata
